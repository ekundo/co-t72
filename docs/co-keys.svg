<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 1016" width="1260" height="1016" font-family="Menlo, Consolas, &quot;DejaVu Sans Mono&quot;, monospace">
<rect width="1260" height="1016" fill="#1414b4"/>
<rect x="8" y="8" width="1244" height="1000" fill="none" stroke="#7ee081" stroke-width="2"/>
<text x="630" y="52" fill="#e8e8f4" font-size="30" text-anchor="middle" letter-spacing="2">КЛАВИШИ CO</text>
<text x="630" y="78" fill="#9fa8e8" font-size="15" text-anchor="middle">файловая оболочка CO 2.0 под МикроДОС T-72</text>
<text x="40" y="118" fill="#7ee081" font-size="17">Панели и командная строка</text>
<line x1="40" y1="126" x2="606" y2="126" stroke="#7ee081" stroke-width="1" opacity="0.45"/>
<rect x="40" y="134" width="36" height="21" rx="4" fill="#f2f2fa"/>
<text x="58" y="149" fill="#14149b" font-size="13" text-anchor="middle">ВК</text>
<text x="88" y="149" fill="#e8e8f4" font-size="13">выполнить строку; если пуста -- действие по расширению из</text>
<text x="88" y="167" fill="#e8e8f4" font-size="13">CO.EXT, на каталоге -- войти в него</text>
<rect x="40" y="177" width="47" height="21" rx="4" fill="#f2f2fa"/>
<text x="63" y="192" fill="#14149b" font-size="13" text-anchor="middle">АР2</text>
<text x="99" y="192" fill="#e8e8f4" font-size="13">очистить командную строку; если пуста -- зафиксировать</text>
<text x="99" y="210" fill="#e8e8f4" font-size="13">вторую функцию цифр, ту же, что при удержании СС; что</text>
<text x="99" y="228" fill="#e8e8f4" font-size="13">сейчас на цифрах, видно в нижней строке экрана</text>
<rect x="40" y="238" width="47" height="21" rx="4" fill="#f2f2fa"/>
<text x="63" y="253" fill="#14149b" font-size="13" text-anchor="middle">ТАБ</text>
<text x="92" y="253" fill="#e8e8f4" font-size="13">,</text>
<rect x="111" y="238" width="30" height="21" rx="4" fill="#f2f2fa"/>
<text x="126" y="253" fill="#14149b" font-size="13" text-anchor="middle">↖</text>
<text x="153" y="253" fill="#e8e8f4" font-size="13">перейти на другую панель</text>
<rect x="40" y="263" width="30" height="21" rx="4" fill="#f2f2fa"/>
<text x="55" y="278" fill="#14149b" font-size="13" text-anchor="middle">↑</text>
<text x="75" y="278" fill="#e8e8f4" font-size="13">,</text>
<rect x="94" y="263" width="30" height="21" rx="4" fill="#f2f2fa"/>
<text x="109" y="278" fill="#14149b" font-size="13" text-anchor="middle">↓</text>
<text x="136" y="278" fill="#e8e8f4" font-size="13">курсор по панели</text>
<rect x="40" y="288" width="30" height="21" rx="4" fill="#f2f2fa"/>
<text x="55" y="303" fill="#14149b" font-size="13" text-anchor="middle">→</text>
<text x="75" y="303" fill="#e8e8f4" font-size="13">,</text>
<rect x="94" y="288" width="30" height="21" rx="4" fill="#f2f2fa"/>
<text x="109" y="303" fill="#14149b" font-size="13" text-anchor="middle">←</text>
<text x="136" y="303" fill="#e8e8f4" font-size="13">курсор по командной строке</text>
<rect x="40" y="313" width="36" height="21" rx="4" fill="#f2f2fa"/>
<text x="58" y="328" fill="#14149b" font-size="13" text-anchor="middle">СС</text>
<text x="82" y="328" fill="#e8e8f4" font-size="13" text-anchor="middle">+</text>
<rect x="89" y="313" width="30" height="21" rx="4" fill="#f2f2fa"/>
<text x="104" y="328" fill="#14149b" font-size="13" text-anchor="middle">→</text>
<text x="124" y="328" fill="#e8e8f4" font-size="13">,</text>
<rect x="143" y="313" width="36" height="21" rx="4" fill="#f2f2fa"/>
<text x="161" y="328" fill="#14149b" font-size="13" text-anchor="middle">СС</text>
<text x="185" y="328" fill="#e8e8f4" font-size="13" text-anchor="middle">+</text>
<rect x="192" y="313" width="30" height="21" rx="4" fill="#f2f2fa"/>
<text x="207" y="328" fill="#14149b" font-size="13" text-anchor="middle">←</text>
<text x="234" y="328" fill="#e8e8f4" font-size="13">курсор по панели через колонку</text>
<rect x="40" y="338" width="36" height="21" rx="4" fill="#f2f2fa"/>
<text x="58" y="353" fill="#14149b" font-size="13" text-anchor="middle">ЗБ</text>
<text x="88" y="353" fill="#e8e8f4" font-size="13">стереть знак перед курсором</text>
<rect x="40" y="363" width="36" height="21" rx="4" fill="#f2f2fa"/>
<text x="58" y="378" fill="#14149b" font-size="13" text-anchor="middle">F1</text>
<text x="81" y="378" fill="#e8e8f4" font-size="13">,</text>
<rect x="100" y="363" width="36" height="21" rx="4" fill="#f2f2fa"/>
<text x="118" y="378" fill="#14149b" font-size="13" text-anchor="middle">F3</text>
<text x="148" y="378" fill="#e8e8f4" font-size="13">следующая и предыдущая команда (помнит 14)</text>
<rect x="40" y="388" width="36" height="21" rx="4" fill="#f2f2fa"/>
<text x="58" y="403" fill="#14149b" font-size="13" text-anchor="middle">F4</text>
<text x="88" y="403" fill="#e8e8f4" font-size="13">имя выделенного файла в командную строку</text>
<rect x="40" y="413" width="36" height="21" rx="4" fill="#f2f2fa"/>
<text x="58" y="428" fill="#14149b" font-size="13" text-anchor="middle">F2</text>
<text x="88" y="428" fill="#e8e8f4" font-size="13">кодировка просмотра: К-8, РУС, ЛАТ, Р/Л</text>
<rect x="40" y="438" width="30" height="21" rx="4" fill="#f2f2fa"/>
<text x="55" y="453" fill="#14149b" font-size="13" text-anchor="middle">;</text>
<text x="82" y="453" fill="#e8e8f4" font-size="13">затем буква -- встать на файл, который с неё начинается</text>
<rect x="40" y="463" width="36" height="21" rx="4" fill="#f2f2fa"/>
<text x="58" y="478" fill="#14149b" font-size="13" text-anchor="middle">ПС</text>
<text x="88" y="478" fill="#e8e8f4" font-size="13">дописать к команде "&gt;C:CO.PTK"</text>
<rect x="40" y="488" width="80" height="21" rx="4" fill="#f2f2fa"/>
<text x="80" y="503" fill="#14149b" font-size="13" text-anchor="middle">Пробел</text>
<text x="132" y="503" fill="#e8e8f4" font-size="13">восстановить системный экран</text>
<text x="40" y="549" fill="#7ee081" font-size="17">СС + цифра</text>
<line x1="40" y1="557" x2="606" y2="557" stroke="#7ee081" stroke-width="1" opacity="0.45"/>
<rect x="40" y="565" width="36" height="21" rx="4" fill="#f2f2fa"/>
<text x="58" y="580" fill="#14149b" font-size="13" text-anchor="middle">СС</text>
<text x="82" y="580" fill="#e8e8f4" font-size="13" text-anchor="middle">+</text>
<rect x="89" y="565" width="30" height="21" rx="4" fill="#f2f2fa"/>
<text x="104" y="580" fill="#14149b" font-size="13" text-anchor="middle">1</text>
<text x="131" y="580" fill="#e8e8f4" font-size="13">вид панели: 40 или 60 файлов</text>
<rect x="40" y="590" width="36" height="21" rx="4" fill="#f2f2fa"/>
<text x="58" y="605" fill="#14149b" font-size="13" text-anchor="middle">СС</text>
<text x="82" y="605" fill="#e8e8f4" font-size="13" text-anchor="middle">+</text>
<rect x="89" y="590" width="30" height="21" rx="4" fill="#f2f2fa"/>
<text x="104" y="605" fill="#14149b" font-size="13" text-anchor="middle">2</text>
<text x="131" y="605" fill="#e8e8f4" font-size="13">атрибуты файла</text>
<rect x="40" y="615" width="36" height="21" rx="4" fill="#f2f2fa"/>
<text x="58" y="630" fill="#14149b" font-size="13" text-anchor="middle">СС</text>
<text x="82" y="630" fill="#e8e8f4" font-size="13" text-anchor="middle">+</text>
<rect x="89" y="615" width="30" height="21" rx="4" fill="#f2f2fa"/>
<text x="104" y="630" fill="#14149b" font-size="13" text-anchor="middle">3</text>
<text x="131" y="630" fill="#e8e8f4" font-size="13">просмотр в КОИ-7</text>
<rect x="40" y="640" width="36" height="21" rx="4" fill="#f2f2fa"/>
<text x="58" y="655" fill="#14149b" font-size="13" text-anchor="middle">СС</text>
<text x="82" y="655" fill="#e8e8f4" font-size="13" text-anchor="middle">+</text>
<rect x="89" y="640" width="30" height="21" rx="4" fill="#f2f2fa"/>
<text x="104" y="655" fill="#14149b" font-size="13" text-anchor="middle">4</text>
<text x="131" y="655" fill="#e8e8f4" font-size="13">правка в WSR (WordStar; под T-72 не работает)</text>
<rect x="40" y="665" width="36" height="21" rx="4" fill="#f2f2fa"/>
<text x="58" y="680" fill="#14149b" font-size="13" text-anchor="middle">СС</text>
<text x="82" y="680" fill="#e8e8f4" font-size="13" text-anchor="middle">+</text>
<rect x="89" y="665" width="30" height="21" rx="4" fill="#f2f2fa"/>
<text x="104" y="680" fill="#14149b" font-size="13" text-anchor="middle">5</text>
<text x="131" y="680" fill="#e8e8f4" font-size="13">копировать с заменой имени, можно по маске</text>
<rect x="40" y="690" width="36" height="21" rx="4" fill="#f2f2fa"/>
<text x="58" y="705" fill="#14149b" font-size="13" text-anchor="middle">СС</text>
<text x="82" y="705" fill="#e8e8f4" font-size="13" text-anchor="middle">+</text>
<rect x="89" y="690" width="30" height="21" rx="4" fill="#f2f2fa"/>
<text x="104" y="705" fill="#14149b" font-size="13" text-anchor="middle">6</text>
<text x="131" y="705" fill="#e8e8f4" font-size="13">записать на магнитофон</text>
<rect x="40" y="715" width="36" height="21" rx="4" fill="#f2f2fa"/>
<text x="58" y="730" fill="#14149b" font-size="13" text-anchor="middle">СС</text>
<text x="82" y="730" fill="#e8e8f4" font-size="13" text-anchor="middle">+</text>
<rect x="89" y="715" width="30" height="21" rx="4" fill="#f2f2fa"/>
<text x="104" y="730" fill="#14149b" font-size="13" text-anchor="middle">7</text>
<text x="131" y="730" fill="#e8e8f4" font-size="13">выбрать дискету НЖМД; без винчестера -- печать файла</text>
<rect x="40" y="740" width="36" height="21" rx="4" fill="#f2f2fa"/>
<text x="58" y="755" fill="#14149b" font-size="13" text-anchor="middle">СС</text>
<text x="82" y="755" fill="#e8e8f4" font-size="13" text-anchor="middle">+</text>
<rect x="89" y="740" width="30" height="21" rx="4" fill="#f2f2fa"/>
<text x="104" y="755" fill="#14149b" font-size="13" text-anchor="middle">8</text>
<text x="131" y="755" fill="#e8e8f4" font-size="13">создать файл</text>
<rect x="40" y="765" width="36" height="21" rx="4" fill="#f2f2fa"/>
<text x="58" y="780" fill="#14149b" font-size="13" text-anchor="middle">СС</text>
<text x="82" y="780" fill="#e8e8f4" font-size="13" text-anchor="middle">+</text>
<rect x="89" y="765" width="30" height="21" rx="4" fill="#f2f2fa"/>
<text x="104" y="780" fill="#14149b" font-size="13" text-anchor="middle">9</text>
<text x="131" y="780" fill="#e8e8f4" font-size="13">загрузить файл в SID</text>
<text x="40" y="826" fill="#7ee081" font-size="17">Ещё сочетания</text>
<line x1="40" y1="834" x2="606" y2="834" stroke="#7ee081" stroke-width="1" opacity="0.45"/>
<rect x="40" y="842" width="36" height="21" rx="4" fill="#f2f2fa"/>
<text x="58" y="857" fill="#14149b" font-size="13" text-anchor="middle">СС</text>
<text x="82" y="857" fill="#e8e8f4" font-size="13" text-anchor="middle">+</text>
<rect x="89" y="842" width="36" height="21" rx="4" fill="#f2f2fa"/>
<text x="107" y="857" fill="#14149b" font-size="13" text-anchor="middle">ВК</text>
<text x="137" y="857" fill="#e8e8f4" font-size="13">вторая строка CO.EXT для этого расширения</text>
<rect x="40" y="867" width="36" height="21" rx="4" fill="#f2f2fa"/>
<text x="58" y="882" fill="#14149b" font-size="13" text-anchor="middle">УС</text>
<text x="82" y="882" fill="#e8e8f4" font-size="13" text-anchor="middle">+</text>
<rect x="89" y="867" width="36" height="21" rx="4" fill="#f2f2fa"/>
<text x="107" y="882" fill="#14149b" font-size="13" text-anchor="middle">ВК</text>
<text x="137" y="882" fill="#e8e8f4" font-size="13">третья строка</text>
<rect x="40" y="892" width="36" height="21" rx="4" fill="#f2f2fa"/>
<text x="58" y="907" fill="#14149b" font-size="13" text-anchor="middle">СС</text>
<text x="82" y="907" fill="#e8e8f4" font-size="13" text-anchor="middle">+</text>
<rect x="89" y="892" width="36" height="21" rx="4" fill="#f2f2fa"/>
<text x="107" y="907" fill="#14149b" font-size="13" text-anchor="middle">УС</text>
<text x="131" y="907" fill="#e8e8f4" font-size="13" text-anchor="middle">+</text>
<rect x="138" y="892" width="36" height="21" rx="4" fill="#f2f2fa"/>
<text x="156" y="907" fill="#14149b" font-size="13" text-anchor="middle">ВК</text>
<text x="186" y="907" fill="#e8e8f4" font-size="13">четвёртая строка</text>
<rect x="40" y="917" width="36" height="21" rx="4" fill="#f2f2fa"/>
<text x="58" y="932" fill="#14149b" font-size="13" text-anchor="middle">УС</text>
<text x="82" y="932" fill="#e8e8f4" font-size="13" text-anchor="middle">+</text>
<rect x="89" y="917" width="30" height="21" rx="4" fill="#f2f2fa"/>
<text x="104" y="932" fill="#14149b" font-size="13" text-anchor="middle">4</text>
<text x="131" y="932" fill="#e8e8f4" font-size="13">правка только что созданного файла</text>
<text x="654" y="118" fill="#7ee081" font-size="17">Метки</text>
<line x1="654" y1="126" x2="1220" y2="126" stroke="#7ee081" stroke-width="1" opacity="0.45"/>
<rect x="654" y="134" width="47" height="21" rx="4" fill="#f2f2fa"/>
<text x="677" y="149" fill="#14149b" font-size="13" text-anchor="middle">СТР</text>
<text x="713" y="149" fill="#e8e8f4" font-size="13">отметить файл; при непустой строке -- дописать имя в неё</text>
<rect x="654" y="159" width="30" height="21" rx="4" fill="#f2f2fa"/>
<text x="669" y="174" fill="#14149b" font-size="13" text-anchor="middle">+</text>
<text x="696" y="174" fill="#e8e8f4" font-size="13">отметить по маске</text>
<rect x="654" y="184" width="30" height="21" rx="4" fill="#f2f2fa"/>
<text x="669" y="199" fill="#14149b" font-size="13" text-anchor="middle">=</text>
<text x="696" y="199" fill="#e8e8f4" font-size="13">отметить те же, что на другой панели</text>
<rect x="654" y="209" width="30" height="21" rx="4" fill="#f2f2fa"/>
<text x="669" y="224" fill="#14149b" font-size="13" text-anchor="middle">/</text>
<text x="696" y="224" fill="#e8e8f4" font-size="13">обратить метки</text>
<rect x="654" y="234" width="30" height="21" rx="4" fill="#f2f2fa"/>
<text x="669" y="249" fill="#14149b" font-size="13" text-anchor="middle">-</text>
<text x="696" y="249" fill="#e8e8f4" font-size="13">снять все метки</text>
<rect x="654" y="259" width="30" height="21" rx="4" fill="#f2f2fa"/>
<text x="669" y="274" fill="#14149b" font-size="13" text-anchor="middle">?</text>
<text x="696" y="274" fill="#e8e8f4" font-size="13">размер файла с точностью до 128 байт</text>
<text x="654" y="320" fill="#7ee081" font-size="17">Цифры -- при пустой командной строке</text>
<line x1="654" y1="328" x2="1220" y2="328" stroke="#7ee081" stroke-width="1" opacity="0.45"/>
<rect x="654" y="336" width="30" height="21" rx="4" fill="#f2f2fa"/>
<text x="669" y="351" fill="#14149b" font-size="13" text-anchor="middle">1</text>
<text x="696" y="351" fill="#e8e8f4" font-size="13">помощь -- этот файл CO.HLP</text>
<rect x="654" y="361" width="30" height="21" rx="4" fill="#f2f2fa"/>
<text x="669" y="376" fill="#14149b" font-size="13" text-anchor="middle">2</text>
<text x="696" y="376" fill="#e8e8f4" font-size="13">меню пользователя из CO.MNU</text>
<rect x="654" y="386" width="30" height="21" rx="4" fill="#f2f2fa"/>
<text x="669" y="401" fill="#14149b" font-size="13" text-anchor="middle">3</text>
<text x="696" y="401" fill="#e8e8f4" font-size="13">просмотр файла</text>
<rect x="654" y="411" width="30" height="21" rx="4" fill="#f2f2fa"/>
<text x="669" y="426" fill="#14149b" font-size="13" text-anchor="middle">4</text>
<text x="696" y="426" fill="#e8e8f4" font-size="13">правка файла в MEDIT</text>
<rect x="654" y="436" width="30" height="21" rx="4" fill="#f2f2fa"/>
<text x="669" y="451" fill="#14149b" font-size="13" text-anchor="middle">5</text>
<text x="696" y="451" fill="#e8e8f4" font-size="13">копировать на другой диск</text>
<rect x="654" y="461" width="30" height="21" rx="4" fill="#f2f2fa"/>
<text x="669" y="476" fill="#14149b" font-size="13" text-anchor="middle">6</text>
<text x="696" y="476" fill="#e8e8f4" font-size="13">переименовать</text>
<rect x="654" y="486" width="30" height="21" rx="4" fill="#f2f2fa"/>
<text x="669" y="501" fill="#14149b" font-size="13" text-anchor="middle">7</text>
<text x="696" y="501" fill="#e8e8f4" font-size="13">сменить диск на панели</text>
<rect x="654" y="511" width="30" height="21" rx="4" fill="#f2f2fa"/>
<text x="669" y="526" fill="#14149b" font-size="13" text-anchor="middle">8</text>
<text x="696" y="526" fill="#e8e8f4" font-size="13">удалить</text>
<rect x="654" y="536" width="30" height="21" rx="4" fill="#f2f2fa"/>
<text x="669" y="551" fill="#14149b" font-size="13" text-anchor="middle">9</text>
<text x="696" y="551" fill="#e8e8f4" font-size="13">настройки: диск B, режим DIR, экран, проверка при</text>
<text x="696" y="569" fill="#e8e8f4" font-size="13">копировании, сортировка</text>
<rect x="654" y="579" width="30" height="21" rx="4" fill="#f2f2fa"/>
<text x="669" y="594" fill="#14149b" font-size="13" text-anchor="middle">0</text>
<text x="696" y="594" fill="#e8e8f4" font-size="13">погасить монитор</text>
<text x="654" y="640" fill="#7ee081" font-size="17">Просмотрщик</text>
<line x1="654" y1="648" x2="1220" y2="648" stroke="#7ee081" stroke-width="1" opacity="0.45"/>
<rect x="654" y="656" width="30" height="21" rx="4" fill="#f2f2fa"/>
<text x="669" y="671" fill="#14149b" font-size="13" text-anchor="middle">↑</text>
<text x="689" y="671" fill="#e8e8f4" font-size="13">,</text>
<rect x="708" y="656" width="30" height="21" rx="4" fill="#f2f2fa"/>
<text x="723" y="671" fill="#14149b" font-size="13" text-anchor="middle">↓</text>
<text x="750" y="671" fill="#e8e8f4" font-size="13">экран назад и вперёд</text>
<rect x="654" y="681" width="36" height="21" rx="4" fill="#f2f2fa"/>
<text x="672" y="696" fill="#14149b" font-size="13" text-anchor="middle">F1</text>
<text x="695" y="696" fill="#e8e8f4" font-size="13">,</text>
<rect x="714" y="681" width="36" height="21" rx="4" fill="#f2f2fa"/>
<text x="732" y="696" fill="#14149b" font-size="13" text-anchor="middle">F4</text>
<text x="762" y="696" fill="#e8e8f4" font-size="13">строка вверх и вниз</text>
